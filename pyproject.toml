[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "datasubway"
version = "0.3.0"
description = "A semantic layer library for data modeling with DataFusion"
readme = "README.md"
requires-python = ">=3.13"
keywords = ["data", "datafusion", "semantic-layer", "data-modeling"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "datafusion>=52.0.0",
    "pyarrow>=18.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.24.0",
]

[tool.maturin]
python-source = "python"
module-name = "datasubway._engine"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests"
]
pythonpath = ["."]
