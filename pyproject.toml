[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datasubway"
version = "0.2.0"
description = "A semantic layer library for data modeling with Polars"
readme = "README.md"
requires-python = ">=3.13"
keywords = ["data", "polars", "semantic-layer", "data-modeling"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "libcst>=1.8.6",
    "polars>=1.36.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
]
