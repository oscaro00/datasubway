[package]
name = "datasubway"
version = "0.3.0"
edition = "2021"

[lib]
name = "datasubway"
crate-type = ["rlib"]

[[bin]]
name = "datasubway"
path = "src/main.rs"

[dependencies]
datafusion = "52"
datafusion-common = "52"
datafusion-expr = "52"
datafusion-optimizer = "52"
datafusion-functions-aggregate = "52"
arrow = { version = "57" }
tokio = { version = "1", features = ["rt-multi-thread"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parquet = { version = "57", features = ["arrow"] }

[dev-dependencies]
tempfile = "3"
