[package]
name = "datasubway"
version = "0.3.0"
edition = "2021"

[lib]
name = "datasubway"
crate-type = ["rlib"]

[[bin]]
name = "datasubway"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
polars = { version = "0.53.0", features = ["lazy"]}
regex = "1.12.3"

[dev-dependencies]
tempfile = "3"
